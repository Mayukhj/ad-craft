<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Admin — Ad Craft</title><link rel="stylesheet" href="/styles.css"></head><body><div id="site-nav"></div><main><section class="page-hero compact"><span class="eyebrow">PRIVATE STUDIO AREA</span><h1>Studio <em>dashboard.</em></h1><p>Sign in to publish new samples, manage enquiries, and keep your portfolio current.</p></section><section class="section admin-section"><div id="admin-login-wrap" class="form-card admin-login"><h2>Admin sign in</h2><form id="admin-login"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary" type="submit">Sign in ↗</button><p class="form-status" aria-live="polite"></p></form></div><div id="admin-dashboard" hidden><div class="admin-top"><div><span class="eyebrow">YOUR CONTENT</span><h2>Manage the studio</h2></div><button id="logout-btn" class="btn btn-outline">Sign out</button></div><div class="admin-columns"><form id="upload-form" class="form-card"><h3>Publish a new sample</h3><label>Advertisement title<input name="title" required maxlength="120" placeholder="e.g. The Summer Edit"></label><label>Category<input name="category" required maxlength="80" placeholder="e.g. Social Media"></label><label>Description<textarea name="description" rows="4" required maxlength="1500" placeholder="Describe the concept…"></textarea></label><label>Starting price (USD)<input name="price" type="number" min="0" step="0.01" required placeholder="49.00"></label><label>Sample image<input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required></label><label>Publish date and time (leave blank to publish now)<input name="publish_at" type="datetime-local"></label><label class="check-label"><input name="featured" type="checkbox"> Feature on homepage</label><button class="btn btn-primary" type="submit">Publish sample ↗</button><p class="form-status" aria-live="polite"></p></form><div class="admin-list"><h3>Published samples</h3><div id="admin-ads"></div></div></div><div class="admin-data"><h3>Booking enquiries & payments</h3><div id="admin-bookings"></div><h3>Contact messages</h3><div id="admin-messages"></div></div></div></section></main><div id="site-footer"></div><script src="/app.js"></script></body></html>
